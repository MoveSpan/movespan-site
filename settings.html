<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#F5F7F4">
  <title>Settings — MoveSpan</title>

  <style>
    :root {
      --primary: #2D7D52;
      --primary-soft: #E9F3ED;
      --background: #F5F7F4;
      --surface: #FFFFFF;
      --surface-alt: #F0F3F0;
      --text: #18211B;
      --secondary: #6D7971;
      --border: #E4E9E5;
      --danger: #B33B3B;
      --shadow: 0 8px 28px rgba(24, 33, 27, .055);
      --radius-card: 22px;
      --radius-control: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-page {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top) + 10px)
        18px
        calc(env(safe-area-inset-bottom) + 40px);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      min-height: 62px;
      margin: 0 -18px 18px;
      padding: 0 18px;
      background: rgba(245, 247, 244, .94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .header-button:active {
      background: rgba(45, 125, 82, .08);
    }

    .header-button svg {
      width: 28px;
      height: 28px;
    }

    .page-title {
      margin: 0;
      text-align: center;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: -.025em;
    }

    .profile-summary {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 27px;
      padding: 19px;
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
    }

    .avatar {
      flex: 0 0 auto;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 21px;
      font-weight: 760;
    }

    .profile-copy {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      overflow: hidden;
      color: var(--text);
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-meta {
      margin-top: 4px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.35;
    }

    .section {
      margin-top: 24px;
    }

    .section-label {
      margin: 0 5px 9px;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .settings-card {
      overflow: hidden;
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
    }

    .settings-row {
      width: 100%;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 17px;
      border: 0;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .settings-row + .settings-row {
      border-top: 1px solid var(--border);
    }

    .settings-row:active {
      background: #F8FAF8;
    }

    .row-icon {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .row-icon svg {
      width: 22px;
      height: 22px;
    }

    .row-copy {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      display: block;
      color: var(--text);
      font-size: 16px;
      line-height: 1.3;
      font-weight: 660;
    }

    .row-description {
      display: block;
      margin-top: 3px;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.35;
    }

    .row-value {
      flex: 0 0 auto;
      color: var(--secondary);
      font-size: 14px;
    }

    .row-chevron {
      flex: 0 0 auto;
      margin-left: 1px;
      color: #9BA59E;
      font-size: 27px;
      line-height: 1;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 52px;
      height: 31px;
      border: 0;
      border-radius: 999px;
      background: #CCD3CE;
      cursor: pointer;
      transition: background .18s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .16);
      transition: transform .18s ease;
    }

    .switch[aria-checked="true"] {
      background: var(--primary);
    }

    .switch[aria-checked="true"]::after {
      transform: translateX(21px);
    }

    .danger-row .row-title {
      color: var(--danger);
    }

    .danger-row .row-icon {
      background: #F9EDED;
      color: var(--danger);
    }

    .version {
      margin: 23px 0 0;
      text-align: center;
      color: #919B94;
      font-size: 12px;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 24, 18, .34);
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet {
      width: min(100%, 520px);
      max-height: 78vh;
      overflow-y: auto;
      padding:
        9px
        18px
        calc(env(safe-area-inset-bottom) + 22px);
      background: var(--surface);
      border-radius: 26px 26px 20px 20px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .20);
    }

    .sheet-handle {
      width: 42px;
      height: 5px;
      margin: 0 auto 15px;
      border-radius: 999px;
      background: #D3D9D5;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .sheet-title {
      margin: 0;
      font-size: 21px;
      font-weight: 720;
    }

    .sheet-close {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--surface-alt);
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
    }

    .option {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 4px;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .option:first-of-type {
      border-top: 0;
    }

    .option-name {
      font-size: 16px;
      font-weight: 610;
    }

    .option-check {
      color: var(--primary);
      font-size: 20px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 24px);
      z-index: 1100;
      max-width: calc(100vw - 36px);
      padding: 12px 17px;
      border-radius: 14px;
      background: #1F2922;
      color: #FFFFFF;
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>

<body>
  <main class="app-page">
    <header class="app-header">
      <button
        class="header-button"
        type="button"
        onclick="goBack()"
        aria-label="Back"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <h1 class="page-title">Settings</h1>

      <span></span>
    </header>

    <section class="profile-summary">
      <div class="avatar" id="profileAvatar">MS</div>

      <div class="profile-copy">
        <div class="profile-name" id="profileName">MoveSpan Member</div>
        <div class="profile-meta">Your personal movement profile</div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-label">Profile</h2>

      <div class="settings-card">
        <button
          class="settings-row"
          type="button"
          onclick="editProfile()"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 21a8 8 0 0 0-16 0"/>
              <circle cx="12" cy="7" r="4"/>
              <path d="M17 3l4 4-8 8-4 1 1-4z"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Edit Profile</span>
            <span class="row-description">
              Update goals, body zones, pain and practice preferences
            </span>
          </span>

          <span class="row-chevron">›</span>
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-label">Preferences</h2>

      <div class="settings-card">
        <div class="settings-row">
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
              <path d="M10 21h4"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Notifications</span>
            <span class="row-description">
              Practice reminders and important updates
            </span>
          </span>

          <button
            id="notificationsSwitch"
            class="switch"
            type="button"
            role="switch"
            aria-label="Notifications"
            aria-checked="true"
            onclick="toggleNotifications()"
          ></button>
        </div>

        <button
          class="settings-row"
          type="button"
          onclick="openChoiceSheet('language')"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18"/>
              <path d="M12 3a15 15 0 0 1 0 18"/>
              <path d="M12 3a15 15 0 0 0 0 18"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Language</span>
            <span class="row-description">
              Application language
            </span>
          </span>

          <span class="row-value" id="languageValue">English</span>
          <span class="row-chevron">›</span>
        </button>

        <button
          class="settings-row"
          type="button"
          onclick="openChoiceSheet('appearance')"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="M4.93 4.93l1.42 1.42"/>
              <path d="M17.66 17.66l1.41 1.41"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="M4.93 19.07l1.42-1.41"/>
              <path d="M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Appearance</span>
            <span class="row-description">
              Light, dark or system preference
            </span>
          </span>

          <span class="row-value" id="appearanceValue">System</span>
          <span class="row-chevron">›</span>
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-label">Privacy and support</h2>

      <div class="settings-card">
        <button
          class="settings-row"
          type="button"
          onclick="showMessage('Privacy and data controls will be connected here.')"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Privacy &amp; Data</span>
            <span class="row-description">
              Personal data and connected services
            </span>
          </span>

          <span class="row-chevron">›</span>
        </button>

        <button
          class="settings-row"
          type="button"
          onclick="showMessage('Help and support center is being prepared.')"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9"/>
              <path d="M9.5 9a2.7 2.7 0 1 1 4.7 1.8c-1.2 1-2.2 1.5-2.2 3.2"/>
              <path d="M12 18h.01"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Help &amp; Support</span>
            <span class="row-description">
              Guides, questions and contact
            </span>
          </span>

          <span class="row-chevron">›</span>
        </button>

        <button
          class="settings-row"
          type="button"
          onclick="showMessage('MoveSpan — mobility, recovery and longevity for life.')"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 11v5"/>
              <path d="M12 8h.01"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">About MoveSpan</span>
            <span class="row-description">
              Product information and version
            </span>
          </span>

          <span class="row-chevron">›</span>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="settings-card">
        <button
          class="settings-row danger-row"
          type="button"
          onclick="signOut()"
        >
          <span class="row-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
          </span>

          <span class="row-copy">
            <span class="row-title">Sign Out</span>
          </span>
        </button>
      </div>
    </section>

    <p class="version">MoveSpan · Settings v1</p>
  </main>

  <div
    class="sheet-backdrop"
    id="choiceSheet"
    onclick="closeSheetFromBackdrop(event)"
  >
    <section class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <h2 class="sheet-title" id="sheetTitle">Select</h2>

        <button
          class="sheet-close"
          type="button"
          onclick="closeChoiceSheet()"
          aria-label="Close"
        >×</button>
      </div>

      <div id="sheetOptions"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SETTINGS_KEYS = {
      notifications: "movespan_settings_notifications",
      language: "movespan_settings_language",
      appearance: "movespan_settings_appearance"
    };

    const labels = {
      language: {
        en: "English",
        ru: "Русский",
        es: "Español"
      },
      appearance: {
        system: "System",
        light: "Light",
        dark: "Dark"
      }
    };

    function goBack() {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = "/home.html";
      }
    }

    function editProfile() {
      window.location.href =
        "/onboarding.html?mode=edit-profile&lock_identity=1";
    }

    function loadProfile() {
      let profile = {};

      try {
        profile = JSON.parse(
          localStorage.getItem("movespan_profile") ||
          localStorage.getItem("mwProfile") ||
          "{}"
        );
      } catch (_) {}

      if (window.mwProfile && typeof window.mwProfile === "object") {
        profile = { ...profile, ...window.mwProfile };
      }

      const name =
        profile.name ||
        profile.firstName ||
        profile.displayName ||
        "MoveSpan Member";

      const initials = name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join("") || "MS";

      document.getElementById("profileName").textContent = name;
      document.getElementById("profileAvatar").textContent = initials;
    }

    function toggleNotifications() {
      const control = document.getElementById("notificationsSwitch");
      const current = control.getAttribute("aria-checked") === "true";
      const next = !current;

      control.setAttribute("aria-checked", String(next));
      localStorage.setItem(SETTINGS_KEYS.notifications, String(next));

      showMessage(
        next
          ? "Notifications enabled"
          : "Notifications disabled"
      );
    }

    function openChoiceSheet(type) {
      const sheet = document.getElementById("choiceSheet");
      const title = document.getElementById("sheetTitle");
      const options = document.getElementById("sheetOptions");

      const values =
        type === "language"
          ? ["en", "ru", "es"]
          : ["system", "light", "dark"];

      const key =
        type === "language"
          ? SETTINGS_KEYS.language
          : SETTINGS_KEYS.appearance;

      const current =
        localStorage.getItem(key) ||
        (type === "language" ? "en" : "system");

      title.textContent =
        type === "language"
          ? "Language"
          : "Appearance";

      options.innerHTML = values.map(value => `
        <button
          class="option"
          type="button"
          onclick="selectChoice('${type}', '${value}')"
        >
          <span class="option-name">${labels[type][value]}</span>
          <span class="option-check">
            ${current === value ? "✓" : ""}
          </span>
        </button>
      `).join("");

      sheet.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeChoiceSheet() {
      document.getElementById("choiceSheet").classList.remove("open");
      document.body.style.overflow = "";
    }

    function closeSheetFromBackdrop(event) {
      if (event.target.id === "choiceSheet") {
        closeChoiceSheet();
      }
    }

    function selectChoice(type, value) {
      const key =
        type === "language"
          ? SETTINGS_KEYS.language
          : SETTINGS_KEYS.appearance;

      localStorage.setItem(key, value);

      if (type === "language") {
        document.getElementById("languageValue").textContent =
          labels.language[value];
      } else {
        document.getElementById("appearanceValue").textContent =
          labels.appearance[value];

        applyAppearance(value);
      }

      closeChoiceSheet();
      showMessage("Preference saved");
    }

    function applyAppearance(value) {
      const dark =
        value === "dark" ||
        (
          value === "system" &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        );

      if (dark) {
        document.documentElement.style.setProperty("--background", "#101512");
        document.documentElement.style.setProperty("--surface", "#19201B");
        document.documentElement.style.setProperty("--surface-alt", "#222B25");
        document.documentElement.style.setProperty("--text", "#F5F7F5");
        document.documentElement.style.setProperty("--secondary", "#AAB4AD");
        document.documentElement.style.setProperty("--border", "#2C3630");
      } else {
        document.documentElement.style.setProperty("--background", "#F5F7F4");
        document.documentElement.style.setProperty("--surface", "#FFFFFF");
        document.documentElement.style.setProperty("--surface-alt", "#F0F3F0");
        document.documentElement.style.setProperty("--text", "#18211B");
        document.documentElement.style.setProperty("--secondary", "#6D7971");
        document.documentElement.style.setProperty("--border", "#E4E9E5");
      }
    }

    function signOut() {
      const confirmed = confirm("Sign out of MoveSpan?");

      if (!confirmed) return;

      if (
        window.mwAuth &&
        typeof window.mwAuth.signOut === "function"
      ) {
        Promise.resolve(window.mwAuth.signOut())
          .finally(() => {
            window.location.href = "/auth.html";
          });

        return;
      }

      showMessage("Sign-out connection will be completed with authentication.");
    }

    let toastTimer;

    function showMessage(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("visible");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("visible");
      }, 2200);
    }

    function initializeSettings() {
      const notifications =
        localStorage.getItem(SETTINGS_KEYS.notifications) !== "false";

      const language =
        localStorage.getItem(SETTINGS_KEYS.language) || "en";

      const appearance =
        localStorage.getItem(SETTINGS_KEYS.appearance) || "system";

      document
        .getElementById("notificationsSwitch")
        .setAttribute("aria-checked", String(notifications));

      document.getElementById("languageValue").textContent =
        labels.language[language] || labels.language.en;

      document.getElementById("appearanceValue").textContent =
        labels.appearance[appearance] || labels.appearance.system;

      applyAppearance(appearance);
      loadProfile();
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeChoiceSheet();
      }
    });

    initializeSettings();
  </script>
</body>
</html>
