<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Connecting WHOOP — MoveSpan</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #1f2933;
    }
    main {
      width: min(420px, calc(100% - 40px));
      text-align: center;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 20px;
      border: 3px solid #e3ece7;
      border-top-color: #2D7D52;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }
    p {
      color: #637067;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Connecting WHOOP</h1>
    <p>Please wait while MoveSpan completes the secure connection.</p>
  </main>

  <script>
    const params = window.location.search;
    window.location.replace(
      "https://movespan-whoop.guy2be.workers.dev/callback" + params
    );
  </script>
</body>
</html>
