<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP Status — MoveSpan</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:30px"><h1>WHOOP Status</h1><pre id="out">Loading…</pre><script type="module">import { auth } from "./firebase-auth.js"; import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"; const out=document.getElementById("out"); onAuthStateChanged(auth,async user=>{if(!user){out.textContent="Not signed in to MoveSpan.";return;} try{const token=await user.getIdToken(); const r=await fetch("https://movespan-whoop.guy2be.workers.dev/summary",{headers:{Authorization:`Bearer ${token}`}}); const text=await r.text(); if(!r.ok){out.textContent=`HTTP ${r.status}\n${text}`;return;} const d=JSON.parse(text); const rec=d.recovery?.records?.[0]?.score||{}; const sl=d.sleep?.records?.[0]?.score||{}; out.textContent=`WHOOP connected: ${d.connected}\nRecovery: ${rec.recovery_score}\nResting HR: ${rec.resting_heart_rate}\nHRV: ${rec.hrv_rmssd_milli?.toFixed(1)} ms\nSpO2: ${rec.spo2_percentage?.toFixed(1)}%\nSleep Performance: ${sl.sleep_performance_percentage}%\nSleep Consistency: ${sl.sleep_consistency_percentage}%\nSleep Efficiency: ${sl.sleep_efficiency_percentage?.toFixed(1)}%`; }catch(e){out.textContent="Error: "+e.message;}});</script></body></html>
