<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b35"><title>Home — MoveSpan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#075b35;--green2:#0d7145;--ink:#132019;--muted:#536174;--line:#dce2e0;--panel:#f7f8f7;--soft:#eaf2ed;--radius:18px;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff}.app{max-width:980px;margin:auto;padding:22px 34px 116px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:700;color:var(--green);letter-spacing:-.05em}.mark{width:34px;height:42px;position:relative}.mark:before,.mark:after{content:"";position:absolute;border:4px solid var(--green);border-radius:90% 8px 90% 8px;transform:rotate(-37deg)}.mark:before{width:13px;height:27px;left:9px;top:1px}.mark:after{width:11px;height:21px;left:1px;top:18px}.actions{display:flex;gap:10px}.action{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:20px;box-shadow:0 2px 7px #1320190c;cursor:pointer}.greeting{margin:13px 3px 18px}.greeting h1{font-size:30px;letter-spacing:-.055em;margin:0 0 5px}.greeting p{margin:0;color:var(--muted);font-size:14px}.stack{display:grid;gap:12px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 3px 12px #1320190d}.metal{background:linear-gradient(110deg,#fff,#eef0f0 48%,#d9dddd,#fafafa);}.metal:after{content:"";pointer-events:none;position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(104deg,transparent 0 4px,#ffffff80 5px 6px)}.card-inner{position:relative;z-index:1;padding:16px 18px}.label,.section-title{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 7px}.section-title small{color:var(--muted);font-size:12px;letter-spacing:0;text-transform:none}.title{font-size:20px;letter-spacing:-.04em;margin:5px 0}.copy{color:var(--muted);font-size:14px;line-height:1.42;margin:0}.note{min-height:140px;padding-left:165px}.note-art{position:absolute;z-index:1;left:28px;top:20px;width:88px;height:92px;background:linear-gradient(135deg,#a5abad,#fff 50%,#767d7d);clip-path:polygon(50% 0,64% 28%,100% 18%,67% 49%,92% 72%,57% 62%,45% 100%,39% 62%,0 84%,29% 46%,5% 29%,38% 29%);filter:drop-shadow(0 6px 4px #3443);opacity:.8}.links{display:flex;gap:20px;margin-top:12px}.text-button{border:0;background:none;padding:0;color:var(--green);font:600 13px inherit;cursor:pointer}.journey{border-color:#0b7046;color:#fff;background:linear-gradient(110deg,#075b35,#0c7047 70%,#064a2c)}.journey:before{content:"";position:absolute;inset:0;opacity:.16;background:repeating-radial-gradient(ellipse at 68% 45%,transparent 0 12px,#b6edcf 13px 14px)}.journey .label,.journey .copy{color:#e7f7ed}.journey .card-inner{min-height:218px;padding-right:43%}.compass{position:absolute;right:47px;top:25px;width:145px;height:145px;border-radius:50%;border:9px solid #e8ecec;background:radial-gradient(circle,#0b7347 0 40%,#174e3a 42%);box-shadow:0 7px 14px #001c2090}.compass:before{content:"✦";position:absolute;inset:19px;display:grid;place-items:center;border:1px solid #c7d3cc;border-radius:50%;color:#fff;font-size:78px;line-height:1}.progress{height:8px;margin:20px 0 5px;border-radius:9px;background:#a0c7b2}.progress i{display:block;width:36%;height:100%;border-radius:9px;background:#fff}.journey .copy.percent{color:#fff;font-weight:600}.primary{border:0;width:100%;border-radius:11px;padding:12px;background:linear-gradient(90deg,#0a6a40,#18784c);color:#fff;font:600 16px inherit;cursor:pointer}.journey .primary{position:absolute;left:18px;right:18px;width:calc(100% - 36px);bottom:14px;background:#ffffff1d}.checkin .card-inner{padding:14px 18px}.checkin-top{display:flex;gap:16px;align-items:center}.glyph{width:64px;height:64px;display:grid;place-items:center;flex:none;border-radius:13px;background:var(--soft);font-size:31px;color:var(--green)}.feels{display:flex;justify-content:space-between;gap:9px;margin-top:13px;padding-left:94px}.feel{border:0;background:none;color:var(--muted);font:500 11px inherit;display:grid;gap:4px;place-items:center;cursor:pointer}.face{width:41px;height:41px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:21px;box-shadow:0 2px 5px #13201915}.feel.selected .face{background:var(--green);color:#fff;border-color:var(--green)}.health .card-inner{padding:13px}.health-grid{display:grid;grid-template-columns:76px repeat(5,1fr);gap:8px;align-items:stretch}.metric{border-radius:12px;background:var(--panel);padding:11px;font-size:12px;color:#283943}.metric b{display:block;margin:8px 0 2px;font-size:22px;color:var(--ink)}.metric small{font-size:11px}.health .glyph{width:auto;height:auto;border-radius:12px}.health .primary{margin-top:8px;padding:9px}.device .card-inner{display:grid;grid-template-columns:70px 1fr 200px;align-items:center;gap:15px}.device .primary{width:auto;padding:11px 18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.practice .card-inner,.reset .card-inner{min-height:190px}.practice .content-row,.reset .content-row{display:flex;gap:13px}.practice .glyph,.reset .glyph{width:65px;height:65px;font-size:30px}.practice .primary,.reset .primary{position:absolute;left:14px;right:14px;bottom:13px;width:calc(100% - 28px);padding:9px;font-size:14px}.assess .card-inner{display:grid;grid-template-columns:70px 1fr 200px;gap:15px;align-items:center}.assess .primary{width:auto;padding:11px 16px}.progress-card .card-inner{padding:13px}.progress-row{display:grid;grid-template-columns:70px repeat(3,1fr) 75px;gap:8px;align-items:center}.stat{border-radius:11px;background:var(--panel);padding:10px;font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:20px;margin-bottom:3px}.ring{width:54px;height:54px;border:8px solid #dbede3;border-top-color:var(--green);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:21px}.utility{display:grid;grid-template-columns:1fr 1fr;gap:12px}.utility .card-inner{display:flex;align-items:center;gap:10px;padding:12px}.utility .glyph{width:50px;height:50px;font-size:25px}.outline{margin-left:auto;border:1px solid #9ec5ae;border-radius:9px;background:#fff;color:var(--green);padding:8px 11px;white-space:nowrap;font:600 12px inherit}.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(980px,100%);padding:0 18px 10px;pointer-events:none}.nav-inner{display:flex;justify-content:space-around;border:1px solid var(--line);border-radius:28px;background:#fffc;backdrop-filter:blur(12px);box-shadow:0 0 15px #13201914;padding:10px;pointer-events:auto}.nav a{font-size:11px;text-align:center;color:var(--muted);text-decoration:none}.nav a b{display:block;font-size:19px;font-weight:400;margin-bottom:3px}.nav a.active{color:var(--green);font-weight:700}.hidden{display:none!important}@media(max-width:640px){.app{padding:16px 14px 98px}.brand{font-size:23px}.mark{transform:scale(.8);transform-origin:left}.action{width:43px;height:43px;font-size:16px}.greeting h1{font-size:25px}.note{padding-left:115px;min-height:155px}.note-art{left:12px;width:75px}.journey .card-inner{padding-right:18px}.compass{opacity:.18;right:-25px;top:38px}.health-grid{grid-template-columns:62px repeat(2,1fr)}.health-grid .metric:nth-of-type(n+4){display:none}.device .card-inner,.assess .card-inner{grid-template-columns:54px 1fr}.device .primary,.assess .primary{grid-column:1/-1;width:100%}.two{grid-template-columns:1fr}.practice .card-inner,.reset .card-inner{min-height:165px}.progress-row{grid-template-columns:repeat(3,1fr)}.progress-row>.glyph,.progress-row>.ring{display:none}.utility{grid-template-columns:1fr}.feels{padding-left:0}.glyph{width:54px;height:54px}.checkin-top .title{font-size:18px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><i class="mark"></i>MoveSpan</div><div class="actions"><button class="action" aria-label="Notifications">♧</button><button class="action" aria-label="Tools">⌘</button><button class="action" aria-label="Settings">⚙</button></div></header><div class="greeting"><h1>Good morning, Dmitry! 👋</h1><p>Let’s take a good step for your body and mind today.</p></div><div class="stack" id="home"></div></main><nav class="nav"><div class="nav-inner"><a class="active" href="/home"><b>⌂</b>Home</a><a href="/program"><b>▷</b>Practice</a><a href="/measure"><b>♡</b>Health</a><a href="/journal"><b>▥</b>Progress</a><a href="/journal"><b>▢</b>Journal</a><a href="#coach"><b>◉</b>AI</a></div></nav><script>
const state={deviceConnected:false,showQuickReset:true,activeJourney:true,assessmentCompleted:false,assessmentExpired:false};const go={note:'/practice-note',journey:'/journey',catalog:'/journey-catalog',checkin:'/program#checkin',health:'/measure',device:'/onboarding?connect=device',practice:'/program',reset:'/reset',assessment:'/test',progress:'/journal'};const button=(label,to,klass='primary')=>`<button class="${klass}" data-go="${to}">${label} →</button>`;const section=(label,content,meta='')=>`<section><div class="section-title">${label}<small>${meta}</small></div>${content}</section>`;const card=(name,content,extra='')=>`<article class="card ${name}"><div class="card-inner">${content}</div>${extra}</article>`;
function note(){return section('Practice Note',card('metal note',`<i class="note-art"></i><div class="label">Practice Note</div><h2 class="title">Small, regular practice matters</h2><p class="copy">Move within a comfortable range today.<br>Consistency is more valuable than intensity.</p><div class="links"><button class="text-button" data-dismiss>Got it</button><button class="text-button" data-go="note">Read more ›</button></div>`))}function journey(){return section("Today's Journey",card('journey',`<i class="compass"></i><div class="label">Today's Journey</div><p class="copy" style="margin-top:8px">Week 2 of 6</p><h2 class="title">Restore Your Foundation</h2><p class="copy">Build ease in your joints and confidence in your movement.</p><div class="progress"><i></i></div><p class="copy percent">36% complete</p>${button(state.activeJourney?'Continue Journey':'Join Journey',state.activeJourney?'journey':'catalog')}`))}function checkin(){return section('Daily Check-in',card('checkin',`<div class="checkin-top"><i class="glyph">♡</i><div><h2 class="title">How are you feeling today?</h2><p class="copy">Your answer helps adapt your practice.</p></div></div><div class="feels">${[['☻','Great'],['☺','Good'],['☹','Okay'],['☹','Not so good'],['☹','Poor']].map((v,i)=>`<button class="feel ${i===0?'selected':''}" data-feel><i class="face">${v[0]}</i>${v[1]}</button>`).join('')}</div>`),'◷ about 30 sec')}function health(){let m=[['♡','Pulse','—','bpm'],['♧','Breathing rate','—','breaths/min'],['','Recovery','—','%'],['','HRV','—','ms'],['☾','Sleep','—','h']];return section('Health Snapshot',card('health',`<div class="health-grid"><i class="glyph">♧</i>${m.map(x=>`<div class="metric">${x[0]} ${x[1]}<b>${x[2]}</b><small>${x[3]}</small></div>`).join('')}</div>${button('Open Health Dashboard','health')}`),'Details ›')}function device(){return state.deviceConnected?'':card('metal device',`<i class="glyph">⌚</i><div><div class="label">Connect your health device</div><p class="copy">Apple Health, WHOOP, Fitbit,<br>Garmin and Oura are supported in this MVP.</p></div>${button('Connect a device','device')}`)}function practice(){return section("Today's Practice",card('practice',`<div class="content-row"><i class="glyph">♙</i><div><p class="copy">Designed for you</p><h2 class="title">Joint Recovery</h2><p class="copy">Gentle mobility for your whole body, with attention to your neck and shoulders.</p></div></div>${button('Start today’s practice','practice')}`),'15 min')}function reset(){return state.showQuickReset?section('Quick Reset',card('reset',`<div class="content-row"><i class="glyph">≋</i><div><h2 class="title">A pause for your body</h2><p class="copy">A short reset is recommended after extended sitting.</p></div></div>${button('Start Reset','reset')}`),'7 min'):''}function assessments(){let title=state.assessmentExpired?'Retake Assessment':state.assessmentCompleted?'View Results':'Take Assessments';let message=state.assessmentCompleted?'Your latest Functional Age is available.':'Improve your program with additional measurements';return section('Assessments',card('assess',`<i class="glyph">▣</i><div><h2 class="title">${message}</h2><p class="copy">Assessments help us understand your body better and personalize your journey.</p></div>${button(title,'assessment')}`),'Learn more ›')}function progress(){return section("Today's Progress",card('progress-card',`<div class="progress-row"><i class="glyph">⌁</i><div class="stat"><b>0</b>Completed today</div><div class="stat"><b>0 / 5</b>Weekly progress</div><div class="stat"><b>36%</b>Journey progress</div><i class="ring">☆</i></div>`),'View all ›')}function utility(){return `<div class="utility"><article class="card"><div class="card-inner"><i class="glyph">▤</i><div><div class="label">Journal</div><p class="copy">Reflect, track, and grow<br>Write in your journal.</p></div><button class="outline" data-go="progress">Open Journal →</button></div></article><article id="coach" class="card"><div class="card-inner"><i class="glyph" style="background:#075b35;color:#fff">◉</i><div><div class="label">AI Coach</div><p class="copy">Get insights and guidance<br>Ask AI anytime.</p></div><button class="outline">Ask AI →</button></div></article></div>`}function render(){document.getElementById('home').innerHTML=[note(),journey(),checkin(),health(),device(),`<div class="two">${practice()}${reset()}</div>`,assessments(),progress(),utility()].join('')}document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-dismiss],[data-feel]');if(!el)return;if(el.dataset.dismiss!==undefined){el.closest('section').classList.add('hidden');return}if(el.dataset.feel!==undefined){document.querySelectorAll('.feel').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');return}if(el.dataset.go==='device'){state.deviceConnected=true;render();return}location.href=go[el.dataset.go]});render();
</script></body></html>
