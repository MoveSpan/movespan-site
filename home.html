<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2D7D52"><title>Home — MoveSpan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#2D7D52;--pale:#E8F5EE;--line:#E2E6EA;--ink:#17221c;--secondary:#5A6370;--soft:#F6F8F7;--radius:18px;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-size:15px}.app{max-width:600px;margin:auto;padding:20px 18px 100px}.header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 24px}.brand{font-size:18px;font-weight:700;letter-spacing:-.04em}.brand span{color:var(--green)}.tools{display:flex;gap:8px}.icon-button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:18px;cursor:pointer}.intro{font-size:13px;color:var(--secondary);margin:-14px 0 20px}.section{margin:0 0 26px}.section-heading{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}.section-heading h2{font-size:18px;letter-spacing:-.03em;margin:0}.section-heading span{font-size:12px;color:var(--secondary)}.card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:17px;box-shadow:0 2px 8px rgba(26,47,35,.04)}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:7px}.card-title{font-size:17px;font-weight:700;letter-spacing:-.025em;margin:0 0 5px}.card-copy{color:var(--secondary);font-size:13px;line-height:1.55;margin:0}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.circle{height:42px;width:42px;display:grid;place-items:center;flex:none;border-radius:13px;background:var(--pale);font-size:20px}.link-button,.primary{border:0;background:transparent;color:var(--green);font:600 13px inherit;cursor:pointer;padding:8px 0}.primary{display:block;width:100%;margin-top:14px;padding:13px 16px;border-radius:13px;background:var(--green);color:#fff;text-align:center;font-size:15px}.journey{background:linear-gradient(135deg,#2D7D52,#1f6340);border:0;color:#fff}.journey .eyebrow,.journey .card-copy{color:#d9f0e3}.progress{height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin:14px 0 4px}.progress i{display:block;height:100%;width:36%;background:#fff;border-radius:99px}.checkin{background:var(--soft);border:0}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.metric{background:var(--soft);border-radius:14px;padding:12px}.metric-value{font-size:23px;font-weight:700;letter-spacing:-.05em}.metric-label{font-size:12px;color:var(--secondary);margin-top:3px}.device{border-style:dashed;background:#fbfdfc}.assessment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.assessment{padding:10px;border-radius:12px;background:var(--soft);font-size:12px;color:var(--secondary)}.assessment b{display:block;font-size:17px;color:var(--ink);margin-top:3px}.today-progress{display:flex;gap:8px}.today-progress div{flex:1;border-radius:13px;background:var(--soft);padding:12px;font-size:12px;color:var(--secondary)}.today-progress b{display:block;font-size:18px;color:var(--ink);margin-bottom:3px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav-inner{width:min(600px,100%);display:flex;justify-content:space-around;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.nav a{color:var(--secondary);font-size:11px;text-align:center;text-decoration:none}.nav a b{display:block;font-size:19px;font-weight:400;margin-bottom:2px}.nav .active{color:var(--green);font-weight:700}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:10;width:min(360px,calc(100% - 32px));padding:12px 16px;border-radius:13px;background:#17221c;color:#fff;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}
</style></head><body><main class="app"><header class="header"><div class="brand">Move<span>Span</span></div><div class="tools"><button class="icon-button" data-destination="/profile" aria-label="Profile">◉</button><button class="icon-button" data-destination="/notifications" aria-label="Notifications">♧</button><button class="icon-button" data-destination="/settings" aria-label="Settings">⚙</button></div></header><p class="intro">Good morning</p><div id="home-content"></div></main><nav class="nav" aria-label="Main navigation"><div class="nav-inner"><a class="active" href="/home"><b>⌂</b>Home</a><a href="/program"><b>▶</b>Practice</a><a href="/journal"><b>◫</b>Progress</a><a href="/measure"><b>◌</b>Health</a></div></nav><div class="toast" id="toast" role="status"></div><script>
const state={deviceConnected:false,showQuickReset:true,activeJourney:true,assessmentCompleted:true,assessmentExpired:false};const destinations={note:'/practice-note',journey:'/journey',catalog:'/journey-catalog',checkin:'/program#checkin',health:'/measure',device:'/onboarding?connect=device',practice:'/program',reset:'/reset',assessment:'/test',progress:'/journal'};const card=(content,classes='')=>`<article class="card ${classes}">${content}</article>`;const action=(label,key,primary=false)=>`<button class="${primary?'primary':'link-button'}" data-go="${key}">${label}${primary?' →':' ›'}</button>`;
function practiceNote(){return `<section class="section"><div class="section-heading"><h2>Practice Note</h2></div>${card(`<div class="eyebrow">A gentle reminder</div><h3 class="card-title">Small, regular practice matters</h3><p class="card-copy">Move within a comfortable range today. Consistency is more valuable than intensity.</p><div class="row" style="margin-top:8px"><button class="link-button" data-got-it>Got it</button>${action('Read more','note')}</div>`)}</section>`}function journey(){const active=state.activeJourney;return `<section class="section"><div class="section-heading"><h2>Today's Journey</h2></div>${card(active?`<div class="eyebrow">Week 2 of 6</div><h3 class="card-title">Restore Your Foundation</h3><p class="card-copy">Build ease in your joints and confidence in your movement.</p><div class="progress"><i></i></div><p class="card-copy">36% complete</p>${action('Continue Journey','journey',true)}`:`<div class="row"><div class="circle">◎</div><div class="grow"><h3 class="card-title">Find your starting point</h3><p class="card-copy">Choose a journey that fits your needs today.</p></div></div>${action('Join a Journey','catalog',true)}`,'journey')}</section>`}function checkin(){return `<section class="section"><div class="section-heading"><h2>Daily Check-in</h2><span>about 30 sec</span></div>${card(`<div class="row"><div class="circle">☀</div><div class="grow"><h3 class="card-title">How are you feeling today?</h3><p class="card-copy">Your answer helps adapt your practice.</p></div></div>${action('Check in','checkin',true)}`,'checkin')}</section>`}function health(){return `<section class="section"><div class="section-heading"><h2>Health Snapshot</h2>${action('Details','health')}</div>${card(`<div class="row"><div class="circle">♡</div><div><h3 class="card-title">Your body today</h3><p class="card-copy">A simple view of your available health data.</p></div></div><div class="metrics"><div class="metric"><div class="metric-value">—</div><div class="metric-label">Pulse</div></div><div class="metric"><div class="metric-value">—</div><div class="metric-label">Breathing rate</div></div>${state.deviceConnected?`<div class="metric"><div class="metric-value">—</div><div class="metric-label">HRV</div></div><div class="metric"><div class="metric-value">—</div><div class="metric-label">Recovery & sleep</div></div>`:''}</div>${action('Open Health Dashboard','health',true)}`)}</section>`}function device(){return state.deviceConnected?'':`<section class="section">${card(`<div class="row"><div class="circle">⌁</div><div class="grow"><h3 class="card-title">Connect your health device</h3><p class="card-copy">Apple Health, WHOOP, Fitbit, Garmin and Oura are supported in this MVP.</p></div></div>${action('Connect a device','device',true)}`,'device')}</section>`}function practice(){return `<section class="section"><div class="section-heading"><h2>Today's Practice</h2><span>15 min</span></div>${card(`<div class="eyebrow">Designed for you</div><h3 class="card-title">Joint Recovery</h3><p class="card-copy">Gentle mobility for your whole body, with attention to your neck and shoulders.</p>${action('Start today’s practice','practice',true)}`)}</section>`}function reset(){return state.showQuickReset?`<section class="section"><div class="section-heading"><h2>Quick Reset</h2><span>7 min</span></div>${card(`<div class="row"><div class="circle">⌇</div><div class="grow"><h3 class="card-title">A pause for your body</h3><p class="card-copy">A short reset is recommended after extended sitting.</p></div></div>${action('Start Reset','reset',true)}`)}</section>`:''}function assessments(){let title='Start Assessment',copy='Get a clear baseline for your movement.';if(state.assessmentCompleted&&!state.assessmentExpired){title='View Results';copy='Your latest Functional Age is available.'}if(state.assessmentExpired){title='Retake Assessment';copy='Your assessment is ready for a refresh.'}return `<section class="section"><div class="section-heading"><h2>Assessments</h2></div>${card(`${state.assessmentCompleted?`<div class="assessment-grid"><div class="assessment">Functional Age<b>—</b></div><div class="assessment">Balance<b>—</b></div><div class="assessment">Mobility<b>—</b></div><div class="assessment">Posture<b>—</b></div></div>`:''}<h3 class="card-title" style="margin-top:${state.assessmentCompleted?'14px':'0'}">${copy}</h3>${action(title,'assessment',true)}`)}</section>`}function progress(){return `<section class="section"><div class="section-heading"><h2>Today's Progress</h2>${action('View all','progress')}</div>${card(`<div class="today-progress"><div><b>0</b>Completed today</div><div><b>0 / 5</b>Weekly progress</div><div><b>36%</b>Journey progress</div></div>${action('Open Progress','progress',true)}`)}</section>`}function render(){document.getElementById('home-content').innerHTML=[practiceNote(),journey(),checkin(),health(),device(),practice(),reset(),assessments(),progress()].join('')}function go(key){if(key==='device'){state.deviceConnected=true;render();showToast('Device connection wizard will open here.');return}window.location.href=destinations[key]}function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}document.addEventListener('click',e=>{const c=e.target.closest('[data-go],[data-destination],[data-got-it]');if(!c)return;if(c.dataset.gotIt!==undefined){c.closest('.section').classList.add('hidden');return}if(c.dataset.go)return go(c.dataset.go);window.location.href=c.dataset.destination});render();
</script></body></html>
