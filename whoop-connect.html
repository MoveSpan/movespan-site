<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Connect WHOOP — MoveSpan</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#1f2933}
    main{width:min(420px,calc(100% - 40px));text-align:center}
    h1{font-size:28px;margin:0 0 12px}
    p{color:#637067;line-height:1.5;margin:0 0 24px}
    button{width:100%;border:0;border-radius:14px;padding:15px 20px;background:#2D7D52;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    #status{margin-top:18px;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>Connect WHOOP</h1>
    <p>Connect your WHOOP account securely to your MoveSpan profile.</p>
    <button id="connect" disabled>Connect WHOOP</button>
    <div id="status">Checking your MoveSpan account…</div>
  </main>

  <script type="module">
    import { auth } from "./firebase-auth.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const button = document.getElementById("connect");
    const status = document.getElementById("status");
    let currentUser = null;

    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (!user) {
        status.textContent = "Please sign in to MoveSpan first.";
        button.disabled = true;
        return;
      }

      status.textContent = "Your MoveSpan account is ready.";
      button.disabled = false;
    });

    button.addEventListener("click", async () => {
      if (!currentUser) return;

      button.disabled = true;
      status.textContent = "Preparing secure WHOOP connection…";

      try {
        const idToken = await currentUser.getIdToken();

        const response = await fetch(
          "https://movespan-whoop.guy2be.workers.dev/connect",
          {
            headers: {
              Authorization: `Bearer ${idToken}`
            }
          }
        );

        if (!response.ok) {
          throw new Error(`Connection request failed: ${response.status}`);
        }

        const data = await response.json();

        if (!data.auth_url) {
          throw new Error("WHOOP authorization URL is missing.");
        }

        window.location.href = data.auth_url;
      } catch (error) {
        console.error(error);
        status.textContent = "Could not start WHOOP connection. Please try again.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
