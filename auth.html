<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoveSpan — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2D7D52;--gl:#E8F5EE;--gb:#A8D5B8;--text:#1A1A1A;--sec:#5A6370;--muted:#9AA3AD;--surface:#F7F9FB;--font:'Inter',sans-serif;--radius:14px;--amber:#F59E0B;--amber-l:#FEF9EC}
body{font-family:var(--font);background:var(--surface);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem}
.card{background:white;border-radius:20px;padding:2rem;box-shadow:0 2px 16px rgba(0,0,0,.08);width:100%;max-width:420px}
.logo{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:1.5rem}
.logo-icon{width:48px;height:48px;border-radius:12px;overflow:hidden;flex-shrink:0;}
.logo-name{font-size:16px;font-weight:600;color:var(--green)}
.tab-row{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:1.5rem}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:8px;transition:.15s;border:none;background:none;font-family:var(--font)}
.tab.active{background:white;color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.form-group{margin-bottom:1rem}
label{display:block;font-size:12px;font-weight:500;color:var(--sec);margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1.5px solid #E2E6EA;border-radius:var(--radius);font-size:14px;font-family:var(--font);color:var(--text);outline:none;transition:.15s}
input:focus{border-color:var(--green)}
.btn{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;margin-top:.5rem;transition:.15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:#FEE;color:#C0392B;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem;display:none}
.success{background:var(--gl);color:var(--green);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem;display:none}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:1rem 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#E2E6EA}
.divider::before{left:0}.divider::after{right:0}
.btn-google{width:100%;padding:12px;background:white;color:var(--text);border:1.5px solid #E2E6EA;border-radius:var(--radius);font-size:14px;font-weight:500;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn-google:hover{border-color:var(--green)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:1rem;line-height:1.5}
.note a{color:var(--green);text-decoration:none}
.loading{display:none;text-align:center;padding:1rem;color:var(--sec);font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="images/brand/movespan-symbol-official.png" alt="MoveSpan" height="36">
    <span style="font-weight:700;font-size:18px;color:#1A1A1A">MoveSpan</span>
  </div>

  <div class="tab-row">
    <button class="tab active" onclick="switchTab('signin')">Sign In</button>
    <button class="tab" onclick="switchTab('signup')">Create Account</button>
  </div>

  <div id="err" class="err"></div>
  <div id="success" class="success"></div>

  <!-- SIGN IN -->
  <div id="form-signin">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="si-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" onclick="signIn()">Sign In →</button>
    <div class="divider">or</div>
    <button class="btn-google" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z" fill="#4285F4"/><path d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.01c-.72.49-1.63.79-2.7.79-2.07 0-3.83-1.4-4.46-3.29H1.9v2.07A8 8 0 008.98 17z" fill="#34A853"/><path d="M4.52 10.55A4.82 4.82 0 014.27 9c0-.54.09-1.06.25-1.55V5.38H1.9A8 8 0 001 9c0 1.3.31 2.52.9 3.62l2.62-2.07z" fill="#FBBC05"/><path d="M8.98 4.16c1.17 0 2.22.4 3.04 1.2l2.27-2.28A8 8 0 001.9 5.38l2.62 2.07c.63-1.9 2.39-3.29 4.46-3.29z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <p class="note"><a href="#" onclick="forgotPassword()">Forgot password?</a></p>
  </div>

  <!-- SIGN UP -->
  <div id="form-signup" style="display:none">
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="su-name" placeholder="First name" autocomplete="given-name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="su-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="su-pass" placeholder="At least 6 characters" autocomplete="new-password">
    </div>
    <button class="btn" onclick="signUp()">Create Account →</button>
    <div class="divider">or</div>
    <button class="btn-google" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z" fill="#4285F4"/><path d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.01c-.72.49-1.63.79-2.7.79-2.07 0-3.83-1.4-4.46-3.29H1.9v2.07A8 8 0 008.98 17z" fill="#34A853"/><path d="M4.52 10.55A4.82 4.82 0 014.27 9c0-.54.09-1.06.25-1.55V5.38H1.9A8 8 0 001 9c0 1.3.31 2.52.9 3.62l2.62-2.07z" fill="#FBBC05"/><path d="M8.98 4.16c1.17 0 2.22.4 3.04 1.2l2.27-2.28A8 8 0 001.9 5.38l2.62 2.07c.63-1.9 2.39-3.29 4.46-3.29z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <p class="note" style="margin-top:1rem">By creating an account you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
  </div>

  <div id="already-in" style="display:none;background:#E8F5EE;border:1.5px solid #A8D5B8;border-radius:14px;padding:1rem 1.25rem;margin-bottom:1.25rem;text-align:center">
    <div style="font-size:14px;font-weight:600;color:#2D7D52;margin-bottom:8px">Already signed in as <span id="already-name"></span></div>
    <a href="/program" style="display:inline-block;padding:9px 20px;background:#2D7D52;color:white;border-radius:20px;font-size:13px;font-weight:500;text-decoration:none;margin-bottom:8px">Go to my program &rarr;</a>
    <div style="font-size:12px;color:#5A6370">or sign in with a different account below</div>
  </div>
  <div class="loading" id="loading">⏳ Loading...</div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithRedirect, getRedirectResult, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// ═══════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAmf3mipVQnucfSfg2gQuhXIyoQrXgywT8",
  authDomain: "auth.movespan.app",
  projectId: "movewell-system",
  storageBucket: "movewell-system.firebasestorage.app",
  messagingSenderId: "996929311338",
  appId: "1:996929311338:web:21db1480febc5523ea7013"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

  // Handle Google redirect result
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// Smart routing: onboarding done → /program, otherwise → /onboarding (resumes saved step)
async function routeAfterAuth(user) {
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    const profile = snap.exists() ? snap.data() : null;
    if (profile && profile.onboarding && profile.onboarding.completedAt) {
      window.location.replace('/program');
      return;
    }
  } catch (e) { console.log('Route check error:', e); }
  window.location.replace('/onboarding');
}

// Already signed in - route by profile
onAuthStateChanged(auth, async (user) => {
  if (user && !window._signingIn) {
    const notice = document.getElementById('already-in');
    if (notice) {
      notice.style.display = 'block';
      const nameEl = document.getElementById('already-name');
      if (nameEl) nameEl.textContent = user.displayName || user.email || '';
    }
  }
});

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('err').style.display = 'none';
}
function hideMessages() {
  document.getElementById('err').style.display = 'none';
  document.getElementById('success').style.display = 'none';
}

async function saveUserProfile(user, name) {
  await setDoc(doc(db, 'users', user.uid), {
    name: name || user.displayName || '',
    email: user.email,
    createdAt: new Date().toISOString(),
    plan: 'free',
    sessions: 0,
    streak: 0,
    referralCode: user.uid.slice(0,8).toUpperCase(),
  }, { merge: true });
}

window.switchTab = function(tab) {
  hideMessages();
  document.getElementById('form-signin').style.display = tab === 'signin' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

window.signIn = async function() {
  hideMessages();
    window._signingIn = true;
  const email = document.getElementById('si-email').value.trim();
  const pass = document.getElementById('si-pass').value;
  if (!email || !pass) { showErr('Please enter email and password'); return; }
  try {
    document.getElementById('loading').style.display = 'block';
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const msgs = {
      'auth/user-not-found': 'No account found with this email',
      'auth/wrong-password': 'Incorrect password',
      'auth/invalid-email': 'Invalid email address',
      'auth/too-many-requests': 'Too many attempts. Please try again later',
    };
    showErr(msgs[e.code] || 'Sign in failed. Please try again');
  }
}

window.signUp = async function() {
  hideMessages();
    window._signingIn = true;
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pass = document.getElementById('su-pass').value;
  if (!name) { showErr('Please enter your name'); return; }
  if (!email) { showErr('Please enter your email'); return; }
  if (pass.length < 6) { showErr('Password must be at least 6 characters'); return; }
  try {
    document.getElementById('loading').style.display = 'block';
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await saveUserProfile(cred.user, name);
    // New user → onboarding
    sessionStorage.setItem('mw_redirect', '/onboarding');
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const msgs = {
      'auth/email-already-in-use': 'An account with this email already exists',
      'auth/invalid-email': 'Invalid email address',
      'auth/weak-password': 'Password is too weak',
    };
    showErr(msgs[e.code] || 'Registration failed. Please try again');
  }
}

window.signInGoogle = async function() {
  hideMessages();
  try {
    window._signingIn = true;
    document.getElementById('loading').style.display = 'block';
    const result = await signInWithPopup(auth, provider);
    const isNew = result._tokenResponse?.isNewUser;
    if (isNew) {
      await saveUserProfile(result.user);
    }
    await routeAfterAuth(result.user);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    console.error('Google auth error:', e.code, e.message);
    showErr('Error: ' + (e.code || e.message));
  }
}

window.forgotPassword = async function() {
  const email = document.getElementById('si-email').value.trim();
  if (!email) { showErr('Enter your email above first'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess('Password reset email sent! Check your inbox');
  } catch(e) {
    showErr('Could not send reset email. Check the address');
  }
}
</script>
</body>
</html>
