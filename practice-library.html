<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Practice Library — MoveSpan</title>

  <style>
    :root {
      --primary: #2D7D52;
      --primary-soft: #EAF4EE;

      --background: #F3F5F4;
      --surface: #FFFFFF;

      --text: #1C2821;
      --secondary: #68736C;
      --muted: #929B95;

      --border: #E3E8E5;

      --radius-card: 18px;
      --radius-icon: 13px;

      --shadow:
        0 1px 2px rgba(20, 45, 31, .03),
        0 7px 22px rgba(20, 45, 31, .055);

      --font:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .app-page {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        calc(36px + env(safe-area-inset-bottom));
    }

    .app-header {
      min-height: 48px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      margin-bottom: 22px;
    }

    .movespan-back {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, .86);
      color: var(--text);

      box-shadow:
        0 1px 3px rgba(20, 45, 31, .06);

      cursor: pointer;
    }

    .movespan-back svg {
      width: 22px;
      height: 22px;
    }

    .page-title {
      margin: 0;
      text-align: center;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: -.015em;
    }

    .intro {
      margin-bottom: 24px;
      padding: 20px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #FFFFFF 0%,
          #F4F8F5 100%
        );

      box-shadow: var(--shadow);
    }

    .intro-label {
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .085em;
      text-transform: uppercase;
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 780;
      letter-spacing: -.02em;
    }

    .intro p {
      margin: 0;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .section {
      margin-top: 24px;
    }

    .section-label {
      margin: 0 5px 9px;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .settings-card {
      overflow: hidden;
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
    }

    .practice-row {
      width: 100%;
      min-height: 82px;

      display: flex;
      align-items: center;
      gap: 13px;

      padding: 14px 16px;

      border: 0;
      background: var(--surface);
      color: var(--text);
      text-align: left;

      cursor: pointer;
    }

    .practice-row + .practice-row {
      border-top: 1px solid var(--border);
    }

    .practice-row:active {
      background: #F7F9F8;
    }

    .practice-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: var(--radius-icon);

      background:
        linear-gradient(
          145deg,
          #F2F8F4 0%,
          #E3F0E8 100%
        );

      color: var(--primary);

      font-size: 14px;
      font-weight: 820;
      letter-spacing: .035em;
    }

    .practice-copy {
      flex: 1;
      min-width: 0;
    }

    .practice-title {
      display: block;
      margin-bottom: 4px;

      font-size: 15px;
      line-height: 1.25;
      font-weight: 740;
    }

    .practice-description {
      display: block;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.4;
    }

    .row-chevron {
      flex: 0 0 auto;
      margin-left: 4px;
      color: #A7B0AA;
      font-size: 25px;
      font-weight: 300;
      line-height: 1;
    }

    .library-note {
      margin: 17px 8px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .version {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(24px + env(safe-area-inset-bottom));

      width: min(calc(100% - 36px), 430px);
      padding: 13px 16px;

      border-radius: 14px;

      background: rgba(28, 40, 33, .94);
      color: #FFFFFF;

      font-size: 13px;
      font-weight: 650;
      line-height: 1.4;
      text-align: center;

      box-shadow:
        0 12px 32px rgba(0, 0, 0, .18);

      opacity: 0;
      pointer-events: none;
      transform:
        translate(-50%, 12px);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.visible {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    @media (max-width: 370px) {
      .app-page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .intro {
        padding: 17px;
      }

      .practice-row {
        min-height: 78px;
        padding-left: 13px;
        padding-right: 13px;
      }

      .practice-icon {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }
    }
  </style>
</head>

<body>
  <main class="app-page">
    <header class="app-header">
      <button
        class="movespan-back"
        type="button"
        onclick="goBack()"
        aria-label="Back"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M15 18 9 12l6-6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <h1 class="page-title">Practice Library</h1>

      <span aria-hidden="true"></span>
    </header>

    <section class="intro">
      <div class="intro-label">MoveSpan Practices</div>

      <h2>Choose your practice</h2>

      <p>
        Explore movement, recovery, breathing, balance,
        meditation and sound practices in one place.
      </p>
    </section>

    <section class="section">
      <div class="section-label">All practices</div>

      <div class="settings-card">
        <button
          class="practice-row"
          type="button"
          data-practice="joint"
          data-title="Joint Recovery"
        >
          <span class="practice-icon">JR</span>

          <span class="practice-copy">
            <span class="practice-title">Joint Recovery</span>
            <span class="practice-description">
              Restore mobility and support comfortable everyday movement.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="release"
          data-title="Body Release"
        >
          <span class="practice-icon">BR</span>

          <span class="practice-copy">
            <span class="practice-title">Body Release</span>
            <span class="practice-description">
              Reduce tension through gentle release and restorative techniques.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="neurogym"
          data-title="Neuro Gym"
        >
          <span class="practice-icon">NG</span>

          <span class="practice-copy">
            <span class="practice-title">Neuro Gym</span>
            <span class="practice-description">
              Train coordination, attention and brain-body connection.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="taichi"
          data-title="Tai Chi & Flow"
        >
          <span class="practice-icon">TC</span>

          <span class="practice-copy">
            <span class="practice-title">Tai Chi &amp; Flow</span>
            <span class="practice-description">
              Develop balance, fluidity and calm through mindful movement.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="walking"
          data-title="Walking Therapy"
        >
          <span class="practice-icon">WT</span>

          <span class="practice-copy">
            <span class="practice-title">Walking Therapy</span>
            <span class="practice-description">
              Use walking, rhythm and attention to support body and mind.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="breathwork"
          data-title="Breathwork & Meditation"
        >
          <span class="practice-icon">BW</span>

          <span class="practice-copy">
            <span class="practice-title">
              Breathwork &amp; Meditation
            </span>
            <span class="practice-description">
              Regulate energy, attention and emotional state through breath.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="sbodyoga"
          data-title="Strong Body Yoga"
        >
          <span class="practice-icon">SY</span>

          <span class="practice-copy">
            <span class="practice-title">Strong Body Yoga</span>
            <span class="practice-description">
              Build practical strength, stability and confident movement.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="aqua"
          data-title="AquaBreath"
        >
          <span class="practice-icon">AQ</span>

          <span class="practice-copy">
            <span class="practice-title">AquaBreath</span>
            <span class="practice-description">
              Water-based breathing, mobility and relaxation practices.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>

        <button
          class="practice-row"
          type="button"
          data-practice="vs"
          data-title="Voice & Sound"
        >
          <span class="practice-icon">VS</span>

          <span class="practice-copy">
            <span class="practice-title">Voice &amp; Sound</span>
            <span class="practice-description">
              Use humming, voice, rhythm and sound for regulation and focus.
            </span>
          </span>

          <span class="row-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <p class="library-note">
        Individual practice libraries will be added in the next stage.
      </p>
    </section>

    <p class="version">MoveSpan · Practice Library v1</p>
  </main>

  <div
    class="toast"
    id="practice-toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      window.location.href = "home.html";
    }

    let toastTimer = null;

    function showPracticeMessage(title) {
      const toast =
        document.getElementById("practice-toast");

      toast.textContent =
        title + " library will open here.";

      toast.classList.add("visible");

      window.clearTimeout(toastTimer);

      toastTimer = window.setTimeout(function () {
        toast.classList.remove("visible");
      }, 2200);
    }

    document
      .querySelectorAll(".practice-row")
      .forEach(function (row) {
        row.addEventListener("click", function () {
          showPracticeMessage(
            row.dataset.title || "Practice"
          );
        });
      });
  </script>
</body>
</html>
